<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWD Rate — الحساب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet"><style>
:root{--ink:#101513;--paper:#f4f1e8;--mint:#7ce2b0;--line:rgba(16,21,19,.13);--muted:#727970;--danger:#b44f3d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(124,226,176,.18),transparent 28%),var(--paper);color:var(--ink);font-family:Cairo,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:1fr 480px;max-width:1200px;margin:auto}.intro{padding:70px 55px;display:flex;flex-direction:column;justify-content:center}.brand{font-weight:800;font-size:22px}.brand span{color:#178a5d}.intro h1{font:clamp(60px,8vw,105px)/.9 'DM Serif Display';margin:35px 0 20px;direction:ltr}.intro p{color:var(--muted);max-width:530px;font-size:17px;line-height:2}.panel{margin:auto 30px;background:rgba(251,249,242,.92);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:0 25px 80px rgba(16,21,19,.12)}.tabs{display:flex;gap:5px;background:#e8e5db;padding:5px;border-radius:14px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:10px;font:700 12px Cairo;cursor:pointer}.tabs button.active{background:var(--ink);color:var(--paper)}h2{margin:25px 0 5px;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-bottom:20px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fffdf6;font:600 14px Cairo;outline:0}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);font:800 13px Cairo;cursor:pointer;margin-top:8px}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.msg{margin-top:12px;padding:10px;border-radius:12px;font-size:11px;background:#e8efe9}.msg.err{background:#f6dfda;color:var(--danger)}.hidden{display:none}.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:12px;margin-top:20px}@media(max-width:850px){.shell{grid-template-columns:1fr}.intro{padding:35px 25px 10px}.intro h1{font-size:65px;margin:25px 0 12px}.panel{margin:20px 17px 35px}}
</style></head><body><main class="shell"><section class="intro"><div class="brand">KWD<span>RATE</span></div><div class="eyebrow">PERSONAL FX INTELLIGENCE</div><h1>YOUR<br>RATE.</h1><p>أنشئ حسابك في KWD Rate لحفظ العملات وشركات الصرافة المفضلة، وإدارة تنبيهات الأسعار، والعودة إلى مقارناتك بسهولة.</p></section><section class="panel"><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="registerTab">إنشاء حساب</button></div><form id="login"><h2>مرحبًا بعودتك</h2><div class="sub">ادخل إلى مساحة أسعارك المفضلة.</div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn">دخول</button><button type="button" class="btn ghost" id="forgot">نسيت كلمة المرور؟</button></form><form id="register" class="hidden"><h2>ابدأ حسابك</h2><div class="sub">مجاني، وتستطيع حذف حسابك لاحقًا.</div><div class="field"><label>الاسم</label><input name="full_name" autocomplete="name"></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn">إنشاء الحساب</button></form><div id="msg" class="msg hidden"></div><a class="back" href="/">← العودة إلى KWD Rate</a></section></main><script>
const $=s=>document.querySelector(s), msg=$('#msg');function show(t,err=false){msg.textContent=t;msg.className='msg'+(err?' err':'')};function tab(which){$('#login').classList.toggle('hidden',which!=='login');$('#register').classList.toggle('hidden',which!=='register');$('#loginTab').classList.toggle('active',which==='login');$('#registerTab').classList.toggle('active',which==='register');msg.classList.add('hidden')}$('#loginTab').onclick=()=>tab('login');$('#registerTab').onclick=()=>tab('register');async function send(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'حدث خطأ');return d}$('#login').onsubmit=async e=>{e.preventDefault();try{const d=await send('/api/auth/login',Object.fromEntries(new FormData(e.target)));location.href='/account.html'}catch(e){show(e.message,true)}};$('#register').onsubmit=async e=>{e.preventDefault();try{const d=await send('/api/auth/register',Object.fromEntries(new FormData(e.target)));show(d.verification?.dev_url?`تم إنشاء الحساب. للتحقق في بيئة التطوير: ${d.verification.dev_url}`:'تم إنشاء الحساب بنجاح.');setTimeout(()=>location.href='/account.html',700)}catch(e){show(e.message,true)}};$('#forgot').onclick=async()=>{const email=prompt('اكتب بريدك الإلكتروني');if(!email)return;try{const d=await send('/api/auth/forgot-password',{email});show(d.dev_url?`رابط الاستعادة في بيئة التطوير: ${d.dev_url}`:d.message)}catch(e){show(e.message,true)}};const reset=new URLSearchParams(location.search).get('reset');if(reset){tab('login');const p=prompt('أدخل كلمة المرور الجديدة (8 أحرف على الأقل)');if(p)send('/api/auth/reset-password',{token:reset,password:p}).then(()=>show('تم تغيير كلمة المرور.')).catch(e=>show(e.message,true))}
</script></body></html>
